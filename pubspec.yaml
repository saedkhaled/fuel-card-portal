name: fleet_cards_demo
description: Offline fuel-card customer portal demo.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  characters: ^1.4.1
  excel: ^4.0.6
  go_router: ^17.5.0
  intl: any
  qr_flutter: ^4.1.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  firebase_ai: ^5.2.0
  firebase_app_check: ^0.5.2
  firebase_core: ^5.2.0
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/demo/manifest.json
    - assets/demo/standard/
    - assets/fonts/OFL-Cairo.txt
    - assets/fonts/OFL-Inter.txt
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
