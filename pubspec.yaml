name: fleet_cards_demo
description: Offline fuel-card customer portal demo.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.5.0
  intl: any
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/demo/manifest.json
    - assets/demo/standard/
